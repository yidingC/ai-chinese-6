<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F5F3FA">
  <title>AI Chinese 6.0 · 选择日期</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <div class="status-bar" aria-hidden="true">
      <span data-status-time>11:20</span>
      <span class="status-icons">5G <span class="battery"></span></span>
    </div>

    <header class="topbar">
      <a class="icon-btn" href="index.html" aria-label="返回 · 选择目标"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.6 5.4 8 12l6.6 6.6"/></svg></a>
    </header>

    <main class="date-main">
      <h1 class="date-title" data-date-title>你哪天入职？</h1>

      <section class="date-quick" data-quick hidden>
        <p class="date-quick-cap">最近考试场次</p>
        <div class="date-quick-row" data-quick-row></div>
      </section>

      <section class="calendar" aria-label="选择日期">
        <div class="cal-head">
          <button class="cal-nav" type="button" data-cal-prev aria-label="上个月"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.6 5.4 8 12l6.6 6.6"/></svg></button>
          <p class="cal-title" data-cal-title></p>
          <button class="cal-nav" type="button" data-cal-next aria-label="下个月"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.4 5.4 16 12l-6.6 6.6"/></svg></button>
        </div>
        <div class="cal-week" aria-hidden="true"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
        <div class="cal-grid" data-cal-grid></div>
      </section>

      <p class="date-readout" data-readout aria-live="polite"></p>

      <button class="cta date-cta" type="button" data-generate>生成准备路线</button>
      <p class="date-note">日期之后可以随时在「我的」里修改</p>
    </main>
  </div>

  <div class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
  <script>
    (function () {
      var GOALS = {
        work:  { addDays: 58, title: '你哪天入职？', page: 'goal-work.html' },
        study: { addDays: 83, title: '你哪天出发？', page: 'goal-study.html' },
        hsk:   { addDays: 72, title: '你哪天考试？', page: 'goal-hsk.html', sessions: [53, 67, 81] }
      };
      var key = new URLSearchParams(location.search).get('goal');
      var goal = GOALS[key] || GOALS.work;

      var WEEK = ['日', '一', '二', '三', '四', '五', '六'];
      function addDays(date, n) { return new Date(date.getFullYear(), date.getMonth(), date.getDate() + n); }
      function iso(date) {
        return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0');
      }
      function sameDay(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
      function daysLeft(date) { return Math.round((date - today) / 86400000); }
      function dayLabel(date) { return (date.getMonth() + 1) + ' 月 ' + date.getDate() + ' 日'; }

      var today = new Date(new Date().getFullYear(), new Date().getMonth(), new Date().getDate());
      var recommended = addDays(today, goal.addDays);
      var selected = recommended;
      var view = new Date(selected.getFullYear(), selected.getMonth(), 1);

      var titleEl = document.querySelector('[data-date-title]');
      var monthEl = document.querySelector('[data-cal-title]');
      var gridEl = document.querySelector('[data-cal-grid]');
      var prevBtn = document.querySelector('[data-cal-prev]');
      var nextBtn = document.querySelector('[data-cal-next]');
      var readoutEl = document.querySelector('[data-readout]');
      var generateBtn = document.querySelector('[data-generate]');
      var quickWrap = document.querySelector('[data-quick]');
      var quickRow = document.querySelector('[data-quick-row]');

      if (titleEl) titleEl.textContent = goal.title;

      function renderCalendar() {
        monthEl.textContent = view.getFullYear() + ' 年 ' + (view.getMonth() + 1) + ' 月';
        prevBtn.disabled = view.getFullYear() === today.getFullYear() && view.getMonth() === today.getMonth();
        gridEl.innerHTML = '';
        var lead = new Date(view.getFullYear(), view.getMonth(), 1).getDay();
        var total = new Date(view.getFullYear(), view.getMonth() + 1, 0).getDate();
        var i;
        for (i = 0; i < lead; i++) {
          var blank = document.createElement('span');
          blank.className = 'cal-blank';
          blank.setAttribute('aria-hidden', 'true');
          gridEl.appendChild(blank);
        }
        for (i = 1; i <= total; i++) {
          var date = new Date(view.getFullYear(), view.getMonth(), i);
          var isPast = date.getTime() < today.getTime();
          var isPicked = sameDay(date, selected);
          var isRec = sameDay(date, recommended);
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'cal-day';
          btn.disabled = isPast;
          btn.setAttribute('aria-pressed', isPicked ? 'true' : 'false');
          btn.setAttribute('aria-label', dayLabel(date) + (isRec ? '（推荐）' : ''));
          if (isPicked) btn.classList.add('selected');
          var num = document.createElement('span');
          num.textContent = i;
          btn.appendChild(num);
          if (isRec) {
            var rec = document.createElement('i');
            rec.className = 'cal-rec';
            rec.textContent = '推荐';
            btn.appendChild(rec);
          }
          btn.addEventListener('click', pickDate(date));
          gridEl.appendChild(btn);
        }
      }

      function pickDate(date) {
        return function () {
          selected = date;
          render();
        };
      }

      function renderReadout() {
        var left = daysLeft(selected);
        if (left <= 0) readoutEl.textContent = dayLabel(selected) + ' · 就是今天';
        else readoutEl.innerHTML = dayLabel(selected) + ' · 还有 <b>' + left + '</b> 天';
      }

      function renderQuick() {
        if (!goal.sessions) return;
        quickWrap.hidden = false;
        quickRow.innerHTML = '';
        goal.sessions.forEach(function (offset, idx) {
          var date = addDays(today, offset);
          var chip = document.createElement('button');
          chip.type = 'button';
          chip.className = 'quick-chip';
          if (sameDay(date, selected)) chip.classList.add('is-active');
          var strong = document.createElement('strong');
          strong.textContent = dayLabel(date);
          var small = document.createElement('small');
          small.textContent = '周' + WEEK[date.getDay()] + ' · 第 ' + (idx + 1) + ' 场';
          chip.appendChild(strong);
          chip.appendChild(small);
          chip.addEventListener('click', function () {
            selected = date;
            view = new Date(date.getFullYear(), date.getMonth(), 1);
            render();
          });
          quickRow.appendChild(chip);
        });
      }

      function render() {
        renderCalendar();
        renderReadout();
        renderQuick();
      }

      prevBtn.addEventListener('click', function () {
        view = new Date(view.getFullYear(), view.getMonth() - 1, 1);
        renderCalendar();
      });
      nextBtn.addEventListener('click', function () {
        view = new Date(view.getFullYear(), view.getMonth() + 1, 1);
        renderCalendar();
      });
      generateBtn.addEventListener('click', function () {
        location.href = goal.page + '?days=' + daysLeft(selected) + '&date=' + iso(selected);
      });

      render();
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>导航玻璃 · 照片材质测试</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden;background:#1c1c1e}
.screen{position:relative;width:390px;height:844px;overflow:hidden;border-radius:47.33px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  color:#17171A;-webkit-font-smoothing:antialiased}
.screen img.bg{position:absolute;left:0;top:0;width:390px;height:844px;object-fit:cover}
/* 与 today-glass2.html 完全相同的导航材质 */
.nav{position:absolute;left:54px;top:737px;width:282px;height:66px;border-radius:33px;
  background:linear-gradient(180deg,rgba(255,255,255,.52),rgba(255,255,255,.24) 45%,rgba(255,255,255,.30));
  -webkit-backdrop-filter:blur(30px) saturate(1.9);backdrop-filter:blur(30px) saturate(1.9);
  box-shadow:0 14px 30px rgba(20,30,60,.13)}
.nav::before{content:"";position:absolute;left:0;right:0;top:0;height:30px;border-radius:33px 33px 0 0;
  background:linear-gradient(180deg,rgba(255,255,255,.52),rgba(255,255,255,0));pointer-events:none}
.nav::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  box-shadow:inset 0 1.5px 1px rgba(255,255,255,.95),inset 0 0 0 1px rgba(255,255,255,.42),inset 0 -10px 18px rgba(255,255,255,.14)}
.nv-home{position:absolute;left:10.5px;top:10.5px;width:90px;height:45px;border-radius:22.5px;background:#6552FF;
  display:flex;align-items:center;justify-content:center;gap:6px;color:#fff;font-size:14.5px;font-weight:800}
.nv-r{position:absolute;top:10px;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.58);
  display:grid;place-items:center;color:#6B6B76}
svg{display:block}
</style>
</head>
<body>
<div class="screen">
  <img class="bg" src="_glass-grass.png" alt="">
  <div class="nav">
    <div class="nv-home">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3.9 11.3 12 4.3l8.1 7"/><path d="M6.3 9.6v9.6h11.4V9.6"/></svg>
      今天
    </div>
    <div class="nv-r" style="left:111.5px">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="8.6"/><circle cx="9" cy="10.4" r="1.15" fill="currentColor" stroke="none"/><circle cx="15" cy="10.4" r="1.15" fill="currentColor" stroke="none"/><path d="M8.8 14.6c1.9 1.9 4.5 1.9 6.4 0"/></svg>
    </div>
    <div class="nv-r" style="left:168.5px">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="3.6" y="5.2" width="16.8" height="15" rx="3"/><path d="M3.6 9.6h16.8M8.2 3.4v3.4M15.8 3.4v3.4"/></svg>
    </div>
    <div class="nv-r" style="left:225.5px">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="8.4" r="3.7"/><path d="M4.8 20.2c1-4.2 3.8-6.4 7.2-6.4s6.2 2.2 7.2 6.4"/></svg>
    </div>
  </div>
</div>
</body>
</html>

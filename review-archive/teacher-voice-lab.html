<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Chinese 6.0 · 课堂页 · 语音优先 / 打字回退</title>
<link rel="icon" href="data:,">
<style>
/* ==========================================================================
   课堂页 v3（静态观感稿）：整页都是她 —— 悬浮控件直接浮在画面上
   · 只做观感，不做交互逻辑；左下角 dev 开关切「讲课态 / 出题态」两帧
   · 视觉语言沿用 v2：色值 / 字体栈 / 导航结构不变，但悬浮控件改深色毛玻璃 + 白字
   · 立绘 ../assets/nancy/nancy-teacher-bust.png 原比例放大裁切，不加任何滤镜
   v2（teacher-class-v2.html）保留不动。
   ========================================================================== */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#12141F}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","HarmonyOS Sans SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  color:#F2F1F8;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
svg{display:block}
img{display:block}

/* ================= 背景层（独立底图层：以后换场景图只改这一层） ================= */
.scene-bg{position:absolute;inset:0;z-index:0;background-color:#28483d;
  background-image:url("teacher-class-board-teach.png");background-position:50% 50%;background-size:cover;background-repeat:no-repeat}
.state-quiz .scene-bg{background-image:url("teacher-class-board-quiz.png")}
.scene-bg::after{content:"";position:absolute;inset:0;
  background:
    linear-gradient(180deg, rgba(11,14,23,.34) 0%, rgba(11,14,23,0) 16%),
    linear-gradient(0deg, rgba(11,13,22,.38) 0%, rgba(11,13,22,0) 18%),
    radial-gradient(120% 92% at 50% 28%, rgba(0,0,0,0) 58%, rgba(0,0,0,.17) 100%)}

/* 新场景图已经自带人物、地板与落地阴影，旧版的独立景深层全部撤掉 */
.floor,.shadow,.nancy{display:none}

/* ================= 地板光带（画面下三分之一，给她站立的纵深） ================= */
.floor{position:absolute;left:0;right:0;top:470px;height:232px;z-index:1;pointer-events:none;
  background:linear-gradient(180deg, rgba(190,202,255,0) 0%, rgba(190,202,255,.050) 40%, rgba(190,202,255,.078) 64%, rgba(190,202,255,0) 100%)}
.floor::after{content:"";position:absolute;left:50%;top:6px;width:400px;height:196px;transform:translateX(-50%);
  background:radial-gradient(50% 50% at 50% 50%, rgba(202,214,255,.085), rgba(202,214,255,0) 70%)}

/* ================= 她的脚前：柔和落地阴影，别让她飘 ================= */
.shadow{position:absolute;left:145px;top:652px;width:150px;height:46px;z-index:1;pointer-events:none;
  background:radial-gradient(50% 50% at 50% 50%, rgba(0,0,0,.56), rgba(0,0,0,.22) 50%, rgba(0,0,0,0) 74%)}

/* ================= 她：全身入画（头顶 y100、鞋底齐操作区上缘），不加滤镜、不拉伸 ================= */
.nancy{position:absolute;top:97px;left:150px;height:595px;width:auto;z-index:3;
  pointer-events:none;-webkit-user-drag:none;user-select:none}

/* ================= 黑板：做大、压到她左肩后方（墙面上的板，不是浮卡） ================= */
.board{position:absolute;left:24px;top:240px;width:214px;height:auto;z-index:2;
  padding:0;transform:rotate(-.45deg)}
.board ul{list-style:none;display:grid;gap:27px}
.board li{display:flex;align-items:center;gap:13px}
.board .pin{flex:none;width:12px;height:12px;border-radius:3px;border:1.7px solid rgba(241,250,245,.60);
  transform:rotate(-2deg);box-shadow:0 0 4px rgba(233,255,242,.08)}
.board .tx{font-family:"Kaiti SC","STKaiti","KaiTi","Microsoft YaHei",sans-serif;
  font-size:18px;font-weight:700;letter-spacing:.055em;line-height:1.2;color:rgba(247,252,248,.93);
  text-shadow:0 0 1px rgba(255,255,255,.62),0 0 7px rgba(255,255,255,.10);white-space:nowrap}

/* ================= 讲台桌沿：底部操作区顶缘一道很淡的横向高光 ================= */
.podium-edge{position:absolute;left:10px;right:10px;top:679px;height:2px;z-index:19;pointer-events:none;border-radius:2px;
  background:linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.24) 16%, rgba(255,255,255,.46) 50%, rgba(255,255,255,.24) 84%, rgba(255,255,255,0) 100%);
  box-shadow:0 0 18px rgba(255,255,255,.12)}

/* ================= 出题态：8% 暗罩（注意力给选项；暗罩压在画面上，不压悬浮控件） ================= */
.scrim{position:absolute;inset:0;z-index:4;background:rgba(0,0,0,.08);opacity:0;
  pointer-events:none;transition:opacity .3s ease}
.state-quiz .scrim{opacity:1}

/* ================= 悬浮胶囊：左上（小头像 + Nancy · 在线）、右上（文字记录 + 收起） ================= */
.pill{position:absolute;top:59px;z-index:6;height:32px;display:flex;align-items:center;border-radius:16px;
  background:rgba(16,18,32,.46);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.96);
  box-shadow:0 10px 24px rgba(4,6,18,.30),inset 0 1px 0 rgba(255,255,255,.12);
  -webkit-backdrop-filter:blur(14px) saturate(1.6);backdrop-filter:blur(14px) saturate(1.6);
  font-size:11.5px;font-weight:700;letter-spacing:.01em}
.pill-l{left:14px;padding:0 12px 0 6px;gap:7px}
.mini-ava{width:21px;height:21px;border-radius:7px;background:linear-gradient(135deg,#6552ff,#9d8fff);color:#fff;
  font-size:10px;font-weight:800;display:grid;place-items:center;box-shadow:0 3px 8px rgba(76,53,232,.35)}
.tdot{width:7px;height:7px;border-radius:50%;background:#35c88f;display:inline-block;flex:none}
.pills-r{position:absolute;right:14px;top:59px;z-index:6;display:flex;gap:8px}
.pillbtn{height:32px;display:flex;align-items:center;gap:5px;padding:0 12px;border-radius:16px;
  background:rgba(16,18,32,.46);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.96);
  box-shadow:0 10px 24px rgba(4,6,18,.30),inset 0 1px 0 rgba(255,255,255,.12);
  -webkit-backdrop-filter:blur(14px) saturate(1.6);backdrop-filter:blur(14px) saturate(1.6);
  font-size:11.5px;font-weight:700}
.pillbtn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}

/* ================= 字幕条：底部操作区上方，半透明深色圆角条，白字，最多两行 ================= */
.cap{position:absolute;left:16px;right:16px;bottom:175px;z-index:22;border-radius:18px;
  display:grid;place-items:center;min-height:46px;padding:11px 16px;
  background:rgba(14,16,30,.62);border:1px solid rgba(255,255,255,.10);
  -webkit-backdrop-filter:blur(14px) saturate(1.5);backdrop-filter:blur(14px) saturate(1.5);
  box-shadow:0 12px 28px rgba(4,6,18,.30);
  color:#fff;font-size:14.5px;font-weight:600;line-height:1.5;letter-spacing:.01em;text-align:center;
  transition:bottom .34s cubic-bezier(.22,.61,.36,1)}
.cap .txt{max-width:100%}
.state-quiz .cap{bottom:291px}

/* ================= 再听一遍（小胶囊，字幕条上方；只出题态） ================= */
.chip{position:absolute;right:16px;bottom:347px;z-index:21;
  height:30px;display:inline-flex;align-items:center;gap:6px;padding:0 13px;border-radius:15px;
  background:rgba(16,18,32,.56);border:1px solid rgba(255,255,255,.16);color:rgba(255,255,255,.96);
  -webkit-backdrop-filter:blur(14px) saturate(1.6);backdrop-filter:blur(14px) saturate(1.6);
  box-shadow:0 8px 20px rgba(4,6,18,.28);
  font-size:11.5px;font-weight:800;letter-spacing:.01em;
  opacity:0;pointer-events:none;transition:opacity .28s ease .06s}
.chip svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.state-quiz .chip{opacity:1}

/* ================= 选项浮卡：整宽毛玻璃白卡，从底部升起；第一张 = 按下态（浅绿底绿字） ================= */
.opts{position:absolute;left:16px;right:16px;bottom:117px;z-index:20;display:grid;gap:10px;
  opacity:0;transform:translateY(18px);pointer-events:none;
  transition:opacity .26s ease,transform .36s cubic-bezier(.22,.61,.36,1)}
.state-quiz .opts{opacity:1;transform:none}
.opt{height:48px;border-radius:18px;padding:0 18px;text-align:left;
  display:flex;align-items:center;
  background:rgba(255,255,255,.90);border:1px solid rgba(255,255,255,.62);color:#252244;
  -webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);
  box-shadow:0 10px 24px rgba(4,6,18,.30);
  font-size:14.5px;font-weight:700;letter-spacing:.01em}
.opt.sel{background:rgba(230,247,239,.94);border-color:#9FE0C6;color:#0B7B5C}

/* ================= 底部操作区：麦克风圆钮 + 输入框（深色毛玻璃，场景从底下隐约透出） ================= */
.composer{position:absolute;left:0;right:0;bottom:117px;z-index:24;display:flex;align-items:center;gap:10px;padding:0 16px;
  opacity:0;transform:translateY(8px);pointer-events:none;
  transition:opacity .22s ease,transform .28s cubic-bezier(.22,.61,.36,1)}
.state-quiz .composer{opacity:0;pointer-events:none}
.input-typing:not(.state-quiz) .composer{opacity:1;transform:none;pointer-events:auto}
.mic{width:46px;height:46px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;border:1px solid rgba(255,255,255,.16);
  background:rgba(16,18,32,.48);color:#fff;
  -webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);
  box-shadow:0 10px 24px rgba(4,6,18,.32),inset 0 1px 0 rgba(255,255,255,.14)}
.mic svg{width:22px;height:22px}
.field{flex:1;min-width:0;height:46px;border-radius:23px;padding:0 17px;
  background:rgba(16,18,32,.48);border:1px solid rgba(255,255,255,.16);color:#fff;
  -webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);
  box-shadow:0 10px 24px rgba(4,6,18,.32),inset 0 1px 0 rgba(255,255,255,.14);
  font-size:13.5px;outline:none}
.field::placeholder{color:rgba(255,255,255,.54)}
.field:focus{border-color:rgba(201,192,251,.55)}

/* ================= 语音优先：默认只留“按住说话”，输入栏收起 ================= */
.voice-dock{position:absolute;left:16px;bottom:38px;z-index:24;display:flex;align-items:center;gap:9px;
  opacity:0;transform:translateY(10px);pointer-events:none;
  transition:opacity .12s ease,transform .18s cubic-bezier(.22,.61,.36,1)}
.voice-mode.nav-hidden:not(.state-quiz) .voice-dock{opacity:1;transform:none;pointer-events:auto;transition-delay:.32s,.32s}
.state-quiz .voice-dock{opacity:0!important;pointer-events:none!important}
.talk{height:50px;border-radius:25px;padding:0 16px 0 7px;display:flex;align-items:center;gap:9px;
  background:rgba(20,22,38,.62);border:1px solid rgba(255,255,255,.18);color:#fff;
  -webkit-backdrop-filter:blur(20px) saturate(1.65);backdrop-filter:blur(20px) saturate(1.65);
  box-shadow:0 12px 28px rgba(8,7,28,.34),inset 0 1px 0 rgba(255,255,255,.16)}
.talk-orb{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:linear-gradient(145deg,#8174ff,#6552ff 58%,#4C35E8);
  box-shadow:0 6px 15px rgba(101,82,255,.42),inset 0 1px 0 rgba(255,255,255,.32)}
.talk-orb svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.talk-tx{font-size:11.5px;font-weight:800;letter-spacing:.03em;white-space:nowrap}
.keybtn{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:rgba(20,22,38,.60);border:1px solid rgba(255,255,255,.17);color:rgba(255,255,255,.90);
  -webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);
  box-shadow:0 10px 24px rgba(8,7,28,.30),inset 0 1px 0 rgba(255,255,255,.14)}
.keybtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.talk:active,.keybtn:active{transform:scale(.96)}
.talk.live .talk-orb{box-shadow:0 0 0 8px rgba(101,82,255,.16),0 0 28px rgba(101,82,255,.48)}

/* ================= 演示控制台：放在手机画布外，不参与截图 ================= */
.dev{position:absolute;right:calc(50% + 224px);top:50%;transform:translateY(-50%);width:200px;z-index:100;
  display:flex;flex-direction:column;gap:8px;padding:15px;border-radius:22px;
  background:linear-gradient(180deg,rgba(32,32,48,.96),rgba(23,23,36,.98));
  border:1px solid rgba(255,255,255,.12);color:#F5F3FF;
  box-shadow:0 24px 60px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.10)}
.dev .tag{font-size:8px;font-weight:800;letter-spacing:.16em;color:#AA9FFF}
.dev .lab-title{font-size:14px;font-weight:800;line-height:1.2;margin-top:1px}
.dev .lab-sub{font-size:9.5px;line-height:1.45;color:rgba(255,255,255,.48);margin-bottom:4px}
.dev button{width:100%;height:42px;border-radius:13px;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.055);
  color:rgba(255,255,255,.88);font-size:11.5px;font-weight:800;display:flex;align-items:center;gap:9px;padding:0 11px;text-align:left}
.dev button svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.dev button span{flex:1}
.dev button em{font-style:normal;font-size:9px;font-weight:700;color:rgba(255,255,255,.44)}
.dev button.on{background:#6552FF;border-color:#6552FF;color:#fff;box-shadow:0 8px 20px rgba(68,45,218,.36)}
.dev button.on em{color:rgba(255,255,255,.74)}
.dev .lab-foot{font-size:9px;line-height:1.4;color:rgba(255,255,255,.38);margin-top:2px}
@media (max-width:860px){.dev{display:none}}
</style>
<link rel="stylesheet" href="../shell.css">
<style>
  /* 公区壳适配（必须放在 shell.css 之后）：深色底 + 深色毛玻璃导航 + 白字状态栏 */
  .shell-stage{background:#12141F}
  .shell-screen{--shell-bg:#1B1F2E;background:#1B1F2E;color:#F2F1F8}
  .shell-screen .shell-st,.shell-screen .shell-si{color:#fff}
  .shell-screen .shell-bat{border-color:rgba(255,255,255,.90)}
  .shell-screen .shell-bat::after{background:rgba(255,255,255,.90)}
  .shell-screen .shell-hbar{background:rgba(255,255,255,.82)}

  .shell-screen .shell-nav{
    background:linear-gradient(180deg,rgba(24,26,44,.66),rgba(18,20,36,.54));
    -webkit-backdrop-filter:blur(20px) saturate(1.8);backdrop-filter:blur(20px) saturate(1.8);
    box-shadow:0 14px 32px rgba(4,6,18,.46)}
  .shell-screen .shell-nav::before{background:linear-gradient(180deg,rgba(255,255,255,.15),rgba(255,255,255,0))}
  .shell-screen .shell-nav::after{box-shadow:inset 0 1.5px 1px rgba(255,255,255,.22),inset 0 0 0 1px rgba(255,255,255,.10),inset 0 -10px 18px rgba(255,255,255,.05)}
  .shell-screen .shell-nav .nv{background:rgba(255,255,255,.10);color:rgba(255,255,255,.74)}
  .shell-screen .shell-nav .nv.is-active{background:#6552FF;color:#fff}

/* ================= 隐藏导航：三种藏法（A 淡出 / B 滑进讲台 / C 收成小把手） ================= */
.shell-screen .shell-nav{transition:transform .46s cubic-bezier(.30,.94,.30,1) .12s,opacity .30s ease .12s,box-shadow .3s ease}
/* A · 淡出下沉：最干净，底部整条空出来 */
.mode-a.nav-hidden .shell-nav{opacity:0;transform:translateY(16px) scale(.985);pointer-events:none}
/* B · 整条滑进讲台：沉下去，带一点余味 */
.mode-b.nav-hidden .shell-nav{opacity:0;transform:translateY(96px);pointer-events:none;transition-delay:0s,0s,0s}
/* C · 收成小把手：缩着沉到底边，留一个能点回来的小胶囊 */
.mode-c .shell-nav{transform-origin:50% 100%}
.mode-c.nav-hidden .shell-nav{opacity:0;transform:translateY(30px) scale(.20);pointer-events:none}

.nav-nub{position:absolute;left:50%;bottom:44px;width:54px;height:28px;margin-left:-27px;z-index:59;
  display:flex;align-items:center;justify-content:center;gap:3px;border-radius:14px;
  background:rgba(24,26,44,.66);border:1px solid rgba(255,255,255,.16);color:rgba(255,255,255,.86);
  -webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);
  box-shadow:0 10px 24px rgba(4,6,18,.34);
  opacity:0;transform:translateY(10px) scale(.86);pointer-events:none;
  transition:opacity .24s ease,transform .34s cubic-bezier(.22,.61,.36,1)}
.nav-nub svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.nav-nub .nub-tx{font-size:10px;font-weight:700;letter-spacing:.08em;line-height:1}
.mode-c.nav-hidden .nav-nub{opacity:1;transform:none;pointer-events:auto;transition-delay:.18s,0s}

/* 截图用：把过渡拉长，好抓中间帧 */
.shell-screen.slow .shell-nav{transition-duration:1500ms,1200ms,.3s}
</style>
</head>
<body data-tab="today">
<div class="shell-stage">
<div class="shell-screen state-teach" id="root">

  <div class="scene-bg" aria-hidden="true"></div>
  <div class="floor" aria-hidden="true"></div>
  <div class="shadow" aria-hidden="true"></div>

  <img class="nancy" src="../assets/nancy/nancy-teacher-cutout.png" alt="" draggable="false">

  <section class="board" aria-label="今天要钉的三个词块">
    <ul>
      <li><i class="pin" aria-hidden="true"></i><span class="tx">周五前</span></li>
      <li><i class="pin" aria-hidden="true"></i><span class="tx">交给小张</span></li>
      <li><i class="pin" aria-hidden="true"></i><span class="tx">好的，我今天先做</span></li>
    </ul>
  </section>

  <div class="scrim" aria-hidden="true"></div>

  <div class="pill pill-l"><span class="mini-ava" aria-hidden="true">N</span>Nancy · 在线<i class="tdot" aria-hidden="true"></i></div>
  <div class="pills-r">
    <button class="pillbtn" type="button">文字记录</button>
    <button class="pillbtn" type="button">收起
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 14 12 9.5 16.5 14"/><path d="M7.5 10 12 14.5 16.5 10"/></svg>
    </button>
  </div>

  <button class="chip" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.6v4.8h3.2L12 18.4V5.6L7.2 9.6Z"/><path d="M15.4 9.2a4 4 0 0 1 0 5.6"/><path d="M17.8 6.8a7.4 7.4 0 0 1 0 10.4"/></svg>再听一遍
  </button>

  <div class="opts" aria-label="选一句回她">
    <button class="opt sel" type="button">好的，我今天先做。</button>
    <button class="opt" type="button">好的，我一会儿交给您。</button>
    <button class="opt" type="button">好的，我周五再来。</button>
  </div>

  <div class="cap" aria-live="polite"><span class="txt" id="capTxt">来，接着昨天。今天就三个词块，钉黑板上。</span></div>

  <div class="composer">
    <button class="mic" id="micReturn" type="button" aria-label="切回语音">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2.8" width="6" height="11" rx="3"/><path d="M5.8 11.4a6.2 6.2 0 0 0 12.4 0"/><path d="M12 17.6v3.2"/></svg>
    </button>
    <input class="field" id="field" type="text" placeholder="说不了？在这里打字…" aria-label="输入文字">
  </div>

  <div class="voice-dock" id="voiceDock" aria-label="语音输入">
    <button class="talk" id="talk" type="button" aria-label="按住说话">
      <span class="talk-orb" aria-hidden="true">
        <svg viewBox="0 0 24 24"><rect x="9" y="2.8" width="6" height="11" rx="3"/><path d="M5.8 11.4a6.2 6.2 0 0 0 12.4 0"/><path d="M12 17.6v3.2"/></svg>
      </span>
      <span class="talk-tx" id="talkTx">按住说话</span>
    </button>
    <button class="keybtn" id="typeOpen" type="button" aria-label="改用键盘输入">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.2" y="5.2" width="17.6" height="13.6" rx="3"/><path d="M6.7 9h.1M10 9h.1M13.3 9h.1M16.6 9h.1M6.7 12.3h.1M10 12.3h.1M13.3 12.3h.1M16.6 12.3h.1M7.2 15.6h9.6"/></svg>
    </button>
  </div>

  <div class="podium-edge" aria-hidden="true"></div>

  <div class="nav-nub" id="nub" aria-label="唤出导航">
    <span class="nub-tx">导航</span>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 14 12 9.5 16.5 14"/></svg>
  </div>
</div>
<aside class="dev" id="dev" aria-label="演示控制台">
  <span class="tag">DEMO</span>
  <div class="lab-title">课堂页演示</div>
  <div class="lab-sub">画布外控制台<br>不参与截图</div>
  <button id="navToggle" type="button" title="显示导航">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.9 11.3 12 4.3l8.1 7"/><path d="M6.3 9.6v9.6h11.4V9.6"/></svg>
    <span>导航</span><em id="navState">已收起</em>
  </button>
  <button id="voiceBtn" class="on" type="button" title="语音态">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="2.8" width="6" height="11" rx="3"/><path d="M5.8 11.4a6.2 6.2 0 0 0 12.4 0"/><path d="M12 17.6v3.2"/></svg>
    <span>语音</span><em>默认</em>
  </button>
  <button id="typeBtn" type="button" title="打字态">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.2" y="5.2" width="17.6" height="13.6" rx="3"/><path d="M6.7 9h.1M10 9h.1M13.3 9h.1M16.6 9h.1M6.7 12.3h.1M10 12.3h.1M13.3 12.3h.1M16.6 12.3h.1M7.2 15.6h9.6"/></svg>
    <span>打字</span><em>回退</em>
  </button>

<script src="../shell.js"></script>
<script>
/* 课堂页 voice lab：B 方案藏导航；默认语音优先，键盘只是回退入口 */
(function () {
  var root = document.getElementById('root');
  var navToggle = document.getElementById('navToggle');
  var navState = document.getElementById('navState');
  var voiceBtn = document.getElementById('voiceBtn');
  var typeBtn = document.getElementById('typeBtn');
  var typeOpen = document.getElementById('typeOpen');
  var micReturn = document.getElementById('micReturn');
    var field = document.getElementById('field');
    var talk = document.getElementById('talk');
    var talkTx = document.getElementById('talkTx');
    var cap = document.getElementById('capTxt');
  root.classList.add('mode-b', 'nav-hidden', 'voice-mode');
  if (/[?&]quiz=1/.test(location.search)) {
    root.classList.remove('state-teach');
    root.classList.add('state-quiz');
    cap.textContent = '听一句。『周五前交给小张。』你回哪句？';
  }
  var capDefault = cap.textContent;
  function setHidden(v) {
    root.classList.toggle('nav-hidden', v);
    navToggle.classList.toggle('on', !v);
    navState.textContent = v ? '已收起' : '已展开';
    navToggle.title = v ? '点击显示导航' : '点击收起导航';
  }
  function setTyping(v) {
    root.classList.toggle('input-typing', v);
    root.classList.toggle('voice-mode', !v);
    voiceBtn.classList.toggle('on', !v);
    typeBtn.classList.toggle('on', v);
    if (v) {
      setHidden(true);
      window.setTimeout(function () { field.focus(); }, 360);
    } else {
      field.blur();
    }
  }
  setHidden(true);
  setTyping(/[?&]type=1/.test(location.search));
  navToggle.addEventListener('click', function () { setHidden(!root.classList.contains('nav-hidden')); });
  voiceBtn.addEventListener('click', function () { setTyping(false); });
  typeBtn.addEventListener('click', function () { setTyping(true); });
  typeOpen.addEventListener('click', function (e) { e.stopPropagation(); setTyping(true); });
  micReturn.addEventListener('click', function (e) { e.stopPropagation(); setTyping(false); });
    function startTalk() {
      talk.classList.add('live');
      talkTx.textContent = '松开结束';
      cap.textContent = '我在听，慢慢说。';
    }
    function endTalk() {
      if (!talk.classList.contains('live')) return;
      talk.classList.remove('live');
      talkTx.textContent = '按住说话';
      cap.textContent = capDefault;
    }
    talk.addEventListener('pointerdown', startTalk);
    talk.addEventListener('pointercancel', endTalk);
    window.addEventListener('pointerup', endTalk);
    window.addEventListener('blur', endTalk);
  var SKIP = '.dev,.shell-nav,.composer,.voice-dock,.opts,.cap,.pill,.pills-r,.chip,.nav-nub';
  root.addEventListener('click', function (e) {
    var t = e.target;
    if (t && t.closest && t.closest(SKIP)) return;
    setHidden(!root.classList.contains('nav-hidden'));
  });
  document.querySelectorAll('.pillbtn')[1].addEventListener('click', function () { setHidden(true); });
  document.addEventListener('click', function (e) {
    var a = e.target && e.target.closest ? e.target.closest('.shell-nav a') : null;
    if (a) { e.preventDefault(); e.stopPropagation(); }
  }, true);
})();
</script>
</body>
</html>
